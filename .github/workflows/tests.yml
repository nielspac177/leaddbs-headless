name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Unit tests (no MATLAB, no data)
        run: |
          python -B tests/test_ct_check.py
          python -B tests/test_scrub.py
          python -B tests/test_electrode_check.py
          python -B tests/test_final_state.py
